<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Minha Princesa ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="gradient-bg"></div>

    <div class="main-container">
        <header>
            <h1 class="titulo">Para Minha Princesa 👑</h1>
            <p class="subtitulo">Cada segundo com você é especial, Vida.</p>
        </header>

        <section class="photo-section">
            <div class="photo-frame">
                <img src="foto-dela.jpg" alt="Foto da minha princesa" class="foto-principal">
            </div>
        </section>

        <section class="counter-section">
            <h2>Estamos juntos há...</h2>
            <div id="counter">
                <div class="counter-item">
                    <span id="days" class="time-num">0</span>
                    <span class="time-label">Dias</span>
                </div>
                <div class="counter-item">
                    <span id="hours" class="time-num">0</span>
                    <span class="time-label">Horas</span>
                </div>
                <div class="counter-item">
                    <span id="minutes" class="time-num">0</span>
                    <span class="time-label">Minutos</span>
                </div>
                <div class="counter-item">
                    <span id="seconds" class="time-num">0</span>
                    <span class="time-label">Segundos</span>
                </div>
            </div>
            <p class="data-inicio">Desde 29 de Junho ao 12:15 ✨</p>
        </section>

        <section class="message-section">
            <p>Amor, minha princesa, minha vida...</p>
            <p>Esse é apenas o começo da nossa história. Eu te amo muito!</p>
            <button class="love-button" onclick="celebrate()">Clica aqui ❤️</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
